name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated database credentials
        shell: bash
        run: |
          db_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "POSTGRES_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgres://volt:$db_password@localhost:5432/volt_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Start test database
        run: |
          docker run -d --name volt-test-db -p 127.0.0.1:5432:5432 -e POSTGRES_USER=volt -e POSTGRES_DB=volt_test -e POSTGRES_PASSWORD postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec volt-test-db pg_isready -U volt -d volt_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l backend)"
      - run: go vet ./...
        working-directory: backend
      - run: go test -race -count=1 -timeout=120s ./...
        working-directory: backend
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python3 scripts/init_env.py
      - run: docker compose up --build --wait -d app worker
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:dev
        working-directory: frontend
      - name: Restart without losing data
        run: python3 scripts/persistence_check.py
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
      - if: always()
        run: docker compose down
