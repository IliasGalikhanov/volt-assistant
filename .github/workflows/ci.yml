name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: volt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U volt -d volt_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://volt:ci-only@localhost:5432/volt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l backend)"
      - run: go vet ./...
        working-directory: backend
      - run: go test -race -count=1 -timeout=120s ./...
        working-directory: backend
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up --build --wait -d app worker
      - run: npm run test:e2e
        working-directory: frontend
      - name: Restart without losing data
        run: python3 scripts/persistence_check.py
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
      - if: always()
        run: docker compose down
