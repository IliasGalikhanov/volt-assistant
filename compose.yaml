name: volt-assistant
services:
  app:
    restart: unless-stopped
    build: .
    image: volt-assistant:local
    environment: &app-environment
      DATABASE_URL: postgres://volt:${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}@db:5432/volt?sslmode=disable
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-qwen3.5:2b}
      EKT_USER: ${EKT_USER:-}
      EKT_PASSWORD: ${EKT_PASSWORD:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    restart: unless-stopped
    image: volt-assistant:local
    command: ["/app/worker"]
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      app:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.40.6
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
  db:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: volt
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt -d volt"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  uploads:
  ollama:
