name: volt-assistant
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: volt
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt -d volt"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
